<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Card Studio Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div class="app-container d-flex flex-column vh-100">
    <header class="navbar px-3 border-bottom border-secondary bg-dark">
      <span class="navbar-brand text-white fw-bold">
        <i class="fa-solid fa-id-card text-primary me-2"></i>ID Card Studio Pro
      </span>
      <div class="d-flex align-items-center gap-2">
        <span id="hwidDisplay" class="badge bg-dark text-info border border-info">HWID: LOADING...</span>
        <span id="licenseBadge" class="badge bg-warning text-dark"><i class="fa-solid fa-lock me-1"></i>Free Mode</span>
        <button class="btn btn-sm btn-outline-light" onclick="openLicenseModal()">Aktivasi Lisensi</button>
      </div>
    </header>

    <div class="main-content container-fluid p-3 flex-grow-1 overflow-hidden">
      <div class="row h-100 g-3">
        <!-- Panel Kontrol Kiri -->
        <div class="col-md-5 d-flex flex-column h-100 overflow-auto">
          <div class="card p-3 mb-3 bg-dark text-light border-secondary">
            <h6 class="text-primary fw-bold mb-2"><i class="fa-solid fa-database me-2"></i>1. Import Database & Template</h6>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label small mb-1 text-muted">Database (.xlsx/.csv)</label>
                <input type="file" id="excelInput" class="form-control form-control-sm bg-dark text-light border-secondary" accept=".xlsx,.xls,.csv">
              </div>
              <div class="col-6">
                <label class="form-label small mb-1 text-muted">BG Template (673x1063)</label>
                <input type="file" id="templateInput" class="form-control form-control-sm bg-dark text-light border-secondary" accept="image/*">
              </div>
            </div>
          </div>

          <div class="card p-3 mb-3 bg-dark text-light border-secondary">
            <h6 class="text-primary fw-bold mb-2"><i class="fa-solid fa-camera me-2"></i>2. Kontrol DSLR (digiCamControl)</h6>
            <div id="camStatus" class="alert alert-danger py-1 small mb-2"><i class="fa-solid fa-circle-xmark me-1"></i>Kamera Terputus</div>
            <div class="row g-2 mb-2">
              <div class="col-4">
                <label class="small text-muted mb-1">ISO</label>
                <select id="isoSelect" class="form-select form-select-sm bg-dark text-light border-secondary" onchange="updateCamSetting('iso', this.value)">
                  <option value="auto">Auto</option>
                  <option value="100">100</option>
                  <option value="200">200</option>
                  <option value="400">400</option>
                  <option value="800">800</option>
                </select>
              </div>
              <div class="col-4">
                <label class="small text-muted mb-1">Aperture</label>
                <select id="apertureSelect" class="form-select form-select-sm bg-dark text-light border-secondary" onchange="updateCamSetting('fnumber', this.value)">
                  <option value="auto">Auto</option>
                  <option value="2.8">f/2.8</option>
                  <option value="4.0">f/4.0</option>
                  <option value="5.6">f/5.6</option>
                </select>
              </div>
              <div class="col-4">
                <label class="small text-muted mb-1">Shutter Speed</label>
                <select id="shutterSelect" class="form-select form-select-sm bg-dark text-light border-secondary" onchange="updateCamSetting('shutterspeed', this.value)">
                  <option value="auto">Auto</option>
                  <option value="1/60">1/60</option>
                  <option value="1/125">1/125</option>
                  <option value="1/250">1/250</option>
                </select>
              </div>
            </div>
            <button class="btn btn-primary w-100 fw-bold py-2 mb-2" onclick="triggerDSLR()"><i class="fa-solid fa-camera me-2"></i>Jepret Kamera Hardware</button>
            <label class="btn btn-outline-info w-100 btn-sm m-0">
              <i class="fa-solid fa-upload me-1"></i> Upload Foto Manual Ke Member Aktif
              <input type="file" id="singlePhotoInput" hidden accept="image/*" onchange="handleManualPhoto(event)">
            </label>
          </div>

          <div class="card p-3 bg-dark text-light border-secondary flex-grow-1">
            <h6 class="text-primary fw-bold mb-2"><i class="fa-solid fa-users me-2"></i>3. Data Anggota</h6>
            <input type="text" id="searchInput" class="form-control form-control-sm bg-dark text-light border-secondary mb-2" placeholder="Cari Nama / ID / Divisi..." oninput="filterDataList()">
            <div class="list-group list-group-flush border rounded border-secondary overflow-auto flex-grow-1" id="dataList" style="max-height: 220px;">
              <div class="list-group-item bg-dark text-muted text-center py-3">Unggah database untuk memuat anggota.</div>
            </div>
          </div>
        </div>

        <!-- Canvas Preview Kanan -->
        <div class="col-md-7 d-flex flex-column h-100">
          <div class="card p-3 bg-dark text-light border-secondary h-100 d-flex flex-column align-items-center justify-content-center">
            <div class="mb-2 text-info fw-bold small" id="activeMemberInfo"><i class="fa-solid fa-user me-1"></i> Belum ada data terpilih</div>
            <canvas id="cardCanvas" width="673" height="1063" class="shadow-lg rounded bg-white" style="max-height: 70vh; width: auto;"></canvas>
            <div class="mt-3 d-flex gap-2 w-100 px-4">
              <button class="btn btn-success flex-fill fw-bold" onclick="downloadSingle()"><i class="fa-solid fa-download me-1"></i> Cetak Single PNG</button>
              <button class="btn btn-warning flex-fill fw-bold" onclick="downloadBatchZip()"><i class="fa-solid fa-file-zipper me-1"></i> Export Batch ZIP</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Lisensi -->
  <div class="modal fade" id="licenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary py-2">
          <h6 class="modal-title"><i class="fa-solid fa-key me-2 text-warning"></i>Aktivasi Lisensi Software</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p style="font-size: 0.75rem;" class="text-muted mb-2">Masukkan 16 digit Lisensi Key khusus HWID mesin ini.</p>
          <input type="text" id="licenseKeyInput" class="form-control mb-3 text-center fw-bold text-uppercase bg-dark text-light border-secondary" placeholder="XXXX-XXXX-XXXX-XXXX">
          <button class="btn btn-primary w-100 fw-bold" onclick="submitLicenseKey()">Aktifkan Lisensi</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="barcodeBuffer" style="display:none;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/canvas-card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
